apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: static-web-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: kubernetes.docker.internal
    http:
      paths:
      - path: /website
        pathType: Prefix
        backend:
          service:
            name: static-web-service
            port:
              number: 8090
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insufficient-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insuffice-web
  template:
    metadata:
      labels:
        app: insuffice-web
    spec:
      containers:
      - name: insuffice-web-container
        image: static-web:latest
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 2Gi
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CONTAINER_NAME
          value: static-web-container
        - name: SERVER_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 80
      nodeSelector:
        mynode: demoNode
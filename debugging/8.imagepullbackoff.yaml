apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: config-web
  template:
    metadata:
      labels:
        app: config-web
    spec:
      containers:
      - name: config-web-container
        image: static-web-unknown:latest
        # command: [""]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CONTAINER_NAME
          value: static-web-container
        - name: SERVER_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 80
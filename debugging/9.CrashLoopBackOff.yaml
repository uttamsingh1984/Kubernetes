apiVersion: apps/v1
kind: Deployment
metadata:
  name: stress-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stress-web
  template:
    metadata:
      labels:
        app: stress-web
    spec:
      containers:
      - name: stress-web-container
        image: polinux/stress
        command: ["stress"]
        args: ["--vm", "1","---vm-bytes","250M","--vm-hang","1"]
        resources:
          requests:
            memory: 100Mi
          limits:
            memory: 200Mi
        ports:
        - containerPort: 80
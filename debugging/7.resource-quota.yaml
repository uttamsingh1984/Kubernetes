apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-compute-quota
  namespace: default # Replace with your target namespace
spec:
  hard:
    # Compute resource totals
    # requests.cpu: "2"
    # requests.memory: 2Gi
    # limits.cpu: "4"
    # limits.memory: 4Gi
    # Object count totals
    pods: "2"  
    services: "5"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: config-web
  template:
    metadata:
      labels:
        app: config-web
    spec:
      containers:
      - name: config-web-container
        image: static-web:latest
        # command: [""]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CONTAINER_NAME
          value: static-web-container
        - name: SERVER_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 80
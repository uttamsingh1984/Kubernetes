---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: config-web
  template:
    metadata:
      labels:
        app: config-web
    spec:
      containers:
      - name: config-web-container
        image: static-web:latest
        # command: [""]
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 2Gi
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CONTAINER_NAME
          value: static-web-container
        - name: SERVER_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 80
        volumeMounts:
        - name: appconfig
          mountPath: /tmp/config
      volumes:
      - name: appconfig
        configMap:
            name: myapp 
            items:
            - key: sample.conf
              path: sample.conf

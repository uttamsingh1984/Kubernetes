apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          image: ecommerce-orders-api:latest
          ports:
            - containerPort: 5200
          env:
            - name: ConnectionStrings__OrdersDatabase
              value: Host=postgres-db;Port=5432;Database=ecommerce_orders;Username=postgres;Password=postgres
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
spec:
  selector:
    app: orders-api
  ports:
    - port: 5200
      targetPort: 5200
  type: ClusterIP

version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  catalog-api:
    build:
      context: ./services/catalog/CatalogApi
    image: ecommerce-catalog-api:latest
    depends_on:
      - postgres
    environment:
      - ConnectionStrings__CatalogDatabase=Host=postgres;Port=5432;Database=ecommerce_catalog;Username=postgres;Password=postgres
    ports:
      - 5100:5100

  orders-api:
    build:
      context: ./services/orders/OrdersApi
    image: ecommerce-orders-api:latest
    depends_on:
      - postgres
    environment:
      - ConnectionStrings__OrdersDatabase=Host=postgres;Port=5432;Database=ecommerce_orders;Username=postgres;Password=postgres
    ports:
      - 5200:5200

  frontend:
    build:
      context: ./frontend
    image: ecommerce-frontend:latest
    depends_on:
      - catalog-api
      - orders-api
    ports:
      - 3000:80

volumes:
  postgres-data:
